name: Ingestão de gastos

# Chama o endpoint de ingestão do app publicado (acorda o Render free se estiver dormindo).
# Secrets necessários no repositório: APP_URL (ex: https://gastos-sync.onrender.com) e PAINEL_SENHA.
on:
  schedule:
    - cron: '0 */3 * * *' # a cada 3 horas (UTC)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ secrets.APP_URL }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - name: Acordar o app
        if: env.APP_URL != ''
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 "$APP_URL/health"
      - name: Rodar ingestão
        if: env.APP_URL != ''
        run: |
          curl -fsS --max-time 900 -u "actions:$PAINEL_SENHA" \
            -H 'content-type: application/json' -d '{"dryRun":false}' \
            "$APP_URL/api/ingest" | jq '{emails, transacoes, inseridas, duplicadas, falhas, erros}'
